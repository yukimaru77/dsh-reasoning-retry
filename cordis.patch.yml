# Output-limit stops are handled by re-posing the input, never by limiting
# thought: the failed step is removed from the model-visible history and re-run
# with an input the model rewrote from the input and its reasoning.
- insert:
    - id: reasoning-retry
      name: dsh-reasoning-retry
      config:
        maxRetries: 5
        guidanceModels: deepseek
        rewriteInputChars: 12000
        rewriteReasoningChars: 12000
        rewriter:
          maxTokens: 16384
          timeoutMs: 180000
        resumeGoalAfterRetry: true
        blockGoalAfterRetries: true
        notifyOnGiveUp: true
        restoreAdapterMaxTokens: true
        degeneration:
          enabled: true
          minLoopChars: 20000
          checkEveryChars: 4000
          inStepRetries: 2
          carryChars: 6000
